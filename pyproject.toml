[project]
name = "simplecutpy"
version = "0.5.1"
description = "A simple video cut tool based on wxpython, ffmpeg"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "logging>=0.4.9.6",
    "pydantic>=2.12.5",
    "pymediainfo>=7.0.1",
    "requests>=2.32.5",
    "wxpython>=4.2.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.17.0",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
